name: evovocab-docker-compose

services:
  api:
    build:
      context: .
      dockerfile: apps/api/docker/dev/Dockerfile
    container_name: evovocab-api
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "5000:5000"
    env_file:
      - apps/api/.env
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.4
    container_name: evovocab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: evovocab
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - evovocab_mysql_data:/var/lib/mysql

volumes:
  evovocab_mysql_data:
