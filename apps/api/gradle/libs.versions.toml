[versions]
java = "21"
spring-boot = "3.5.16"
dependency-management = "1.1.6"
liquibase = "2.2.2"
mysql = "8.4.0"
lombok = "1.18.42"
lombok-mapstruct-binding = "0.2.0"
mapstruct = "1.6.3"
disruptor = "4.0.0"
swagger = "2.8.13"
jwt = "0.13.0"

[libraries]
# --- Spring Boot Starters ---
spring-boot-starter-data-jpa = { module= "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-log4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# --- Database ---
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }

# --- Tools ---
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok"}
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
liquibase-core = { module = "org.liquibase:liquibase-core"}
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# --- Testing ---
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
h2-db = { module = "com.h2database:h2" }

# --- Swagger ---
springdoc-openapi-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "swagger" }

# --- Security ---
jjwt-api = {module = "io.jsonwebtoken:jjwt-api", version.ref = "jwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwt" }

[plugins]
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibase" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
