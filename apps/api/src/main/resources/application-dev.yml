spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  datasource:
    url: ${DB_MYSQL_URL}
    username: ${DB_MYSQL_USERNAME}
    password: ${DB_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        createDatabaseIfNotExist: true
        serverTimezone: UTC
        characterEncoding: UTF-8
        connectionCollation: utf8mb4_0900_ai_ci

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master-dev.yaml
    contexts: dev
    drop-first: true

logging:
  config: classpath:log4j2-dev.yaml
