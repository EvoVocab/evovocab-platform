Configuration:
  status: warn
  name: "DevConfig"

  Properties:
    Property:
      - name: "CONSOLE_PATTERN"
        value: "%style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{green} %highlight{%-5level} [%style{%t}{bright,blue}] %style{%logger{36}}{bright,yellow}: %msg%n%throwable"

  Appenders:
    Console:
      name: "ConsoleAppender"
      target: "SYSTEM_OUT"
      follow: true
      PatternLayout:
        pattern: "${CONSOLE_PATTERN}"

  Loggers:
    Logger:
      # 1. Log Application của bạn
      - name: "com.evovocab"
        level: "debug"
        additivity: false
        AppenderRef:
          - ref: "ConsoleAppender"

      # 2. Log Hibernate SQL
      - name: "org.hibernate.SQL"
        level: "debug"
        additivity: false
        AppenderRef:
          - ref: "ConsoleAppender"

      # 3. Log tham số binding của Hibernate (hiển thị giá trị thay cho dấu ?)
      - name: "org.hibernate.orm.jdbc.bind"
        level: "trace"
        additivity: false
        AppenderRef:
          - ref: "ConsoleAppender"

      # 4. Debug Web/REST API (Bổ sung)
      - name: "org.springframework.web"
        level: "debug"
        additivity: false
        AppenderRef:
          - ref: "ConsoleAppender"

      # 5. Debug Security & Filter Chain (Bổ sung)
      - name: "org.springframework.security"
        level: "debug"
        additivity: false
        AppenderRef:
          - ref: "ConsoleAppender"

    Root:
      level: "info"
      AppenderRef:
        - ref: "ConsoleAppender"
