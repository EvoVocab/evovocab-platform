spring:
  application:
    name: ${APP_NAME}

server:
  port: ${SERVER_PORT}
  address: ${SERVER_HOST}
  servlet:
    context-path: ${SERVER_PREFIX}
  shutdown: graceful
  error:
    path: /error
    include-message: always
    include-stacktrace: never
    include-binding-errors: always

management:
  server:
    port: ${SERVER_PORT}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env
  endpoint:
    health:
      show-details: always

spring doc:
  show-actuator: true

security:
  cors:
    allowed-origins: ${CLIENT_URL}
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  public-urls:
    - /public/**
    - /actuator
    - /actuator/**
    - /v3/api-docs
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
